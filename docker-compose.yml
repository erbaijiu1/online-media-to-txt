services:
  media-converter:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: media-converter
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/app:/app/app
      - ./temp_audio:/tmp/temp_audio
      - ./hf_cache:/app/hf_cache
    restart: unless-stopped
